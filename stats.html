<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memoria - Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-page">

        <!-- En-tête avec le bouton retour -->
        <header class="app-header">
            <a class="back-btn" href="step4.html" aria-label="Back">&larr;</a>
            <h1 class="app-title">Memoria</h1>
            <p class="app-sub">Your results</p>
        </header>

        <main class="main-content">

            <!-- Colonne gauche -->
            <section class="card">
                <img src="image/vase.jpg" alt="" class="vase-img">
                <h2 class="final-score"></h2> // score affich'la
                <p class="instruction"></p>  // stat affichen'la
                <img src="image/chapeau.jpg" alt="" class="hat-img">
            </section>

            <!-- Colonne droite -->
            <section class="side">
                <h2 class="results-title">Your answers</h2>

                <!-- Historique des réponses de l'utilisateur -->
                <ul class="results-list">
                    <li class="result-item">
                        <span class="result-word"></span> // jerevo tasara couleur eto soit vert soit rouge dépend de la réponse
                        <span class="user-answer"></span>
                        <span class="status-icon"></span>
                    </li>
                    <li class="result-item">
                        <span class="result-word"></span>
                        <span class="user-answer"></span>
                        <span class="status-icon"></span>
                    </li>
                    <li class="result-item">
                        <span class="result-word"></span>
                        <span class="user-answer"><span class="correction-text"></span></span>
                        <span class="status-icon"></span>
                    </li>
                    <li class="result-item">
                        <span class="result-word"></span>
                        <span class="user-answer"></span>
                        <span class="status-icon"></span>
                    </li>
                </ul>

                <a class="submit-btn" href="index.html">Play again</a>
            </section>

        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
