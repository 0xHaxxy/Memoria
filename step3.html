<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memoria - Quiz 3/4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-page">

        <!-- En-tête avec le bouton retour -->
        <header class="app-header">
            <a class="back-btn" href="step2.html" aria-label="Back">&larr;</a>
            <h1 class="app-title">Memoria</h1>
            <p class="app-sub">Learn Spanish</p>
        </header>

        <main class="main-content">

            <!-- Colonne gauche -->
            <section class="card">
                <img src="image/vase.jpg" alt="" class="vase-img">
                <h2 class="spanish-word"></h2>  //random mots affichen'la
                <p class="instruction">What does it mean?</p>
                <img src="image/chapeau.jpg" alt="" class="hat-img">
            </section>

            <!-- Colonne droite -->
            <section class="side">
                <!-- Barre de progression -->
                <div class="progress-bar">
                    <div class="progress-fill three-quarters"></div>
                </div>
                <p class="progression">3/4</p>

                <!-- Les 4 réponses possibles -->  // 4 boutons affichen'la
                <div class="options-grid">
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                </div>

                <!-- Message de correction : affiche la bonne réponse -->
                <p class="feedback-msg error"></p>  // affichage feedback soit correct soit incorrect ampin'la color am js

                <a class="submit-btn" href="step4.html">Submit</a>
            </section>

        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
