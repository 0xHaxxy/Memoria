<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Memoria - Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- En-tête avec le bouton retour -->
        <div class="app-header">
            <a href="index.html">
                <button class="back-btn">←</button>
            </a>
            <h2 class="app-title">Memoria</h2>
            <p class="app-subtitle">Learn Spanish</p>
        </div>


        <!-- Le contenu principal  -->
        <div class="main-content">

            <!-- COLONNE GAUCHE  -->
            <div class="carte-blanche">
                <!-- Petites icônes décoratives -->
                <div class="decor-icons">
                    <span class="icon-item"></span>
                    <span class="icon-item"></span>
                    <span class="icon-item"></span>
                </div>

                <h1 class="spanish-word">Hola</h1>
                <p class="instruction">What does it mean?</p>
                <img src="image/chapeau.jpg" alt="Chapeau" class="chapeau-img">
            </div>

            <!-- COLONNE DROITE  -->
            <div class="instructions-droite">

                <!-- Barre de progression orange  -->
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>

                <!-- Texte de suivi (Classe progression) -->
                <p class="progression">1/4</p>

                <!-- La grille contenant les 4 boutons de réponse -->
                <div class="options-grid">
                    <button class="option-btn">Take</button>
                    <!-- On selectionne la case Hello -->
                    <button class="option-btn selected">Hello</button>
                    <button class="option-btn">Door</button>
                    <button class="option-btn">Water</button>
                </div>

                <!--  bouton de validation -->
                <a href="step2.html">
                    <button class="submit-btn">Submit</button>
                </a>
            </div>

        </div>

        <script src="script.js"></script>

    </div>

</body>

</html>
