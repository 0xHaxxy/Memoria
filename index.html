<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Memoria - Learn Spanish</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- En-tête de l'application -->
        <div class="app-header">
            <h2 class="app-title">Memoria</h2>
            <p class="app-subtitle">Learn Spanish</p>
        </div>

        <!-- Le contenu principal  -->
        <div class="main-content">

            <!-- COLONNE GAUCHE  -->
            <div class="carte-blanche">
             <!-- Les trois petites formes orange oubliées -->
                <div class="decor-icons">
                    <span class="icon-item"></span>
                    <span class="icon-item"></span>
                    <span class="icon-item"></span>
                </div>

                <h1 class="welcome-title">¡Bienvenido!</h1>
                <p class="instruction">Learn Spanish, one word at a time</p>
                <img src="image/chapeau.jpg" alt="Chapeau" class="chapeau-img">
            </div>
            <!-- COLONNE DROITE -->
            <div class="instructions-droite">
                
                <!-- La grille contenant les étapes  -->
                <div class="options-grid">
                    <div class="option-btn"><span>1</span> Read the Spanish word</div>
                    <div class="option-btn"><span>2</span> Pick its English meaning</div>
                    <div class="option-btn"><span>3</span> Submit and check your score</div>
                </div>

                <!-- Infos de temps (avec ta classe progression) -->
                <p class="progression">4 words · about 1 minute</p>

                <!--  bouton de validation -->
                <a href="step1.html">
                    <button class="submit-btn">Start</button>
                </a>
            </div>

        </div>

        <script src="script.js"></script>

    </div>

</body>

</html>
