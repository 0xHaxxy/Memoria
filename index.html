<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start-page">

    <header class="app-header">
        <h1 class="app-title">Memoria</h1>
        <p class="app-sub">Learn Spanish</p>
    </header>

    <main class="main-content">
        <section class="card">
        <div class="decor-icons" aria-hidden="true">
            <span class="icon-item"></span>
            <span class="icon-item"></span>
            <span class="icon-item"></span>
        </div>
            <h2 class="welcome-title">¡Bienvenido!</h2>
            <p class="instruction">Learn Spanish, one word at a time</p>
            <img src="image/chapeau.png" alt="" class="hat-img">
        </section>

        <section class="side">
            <ol class="steps">
                <li class="step">Read the Spanish word</li>
                <li class="step">Pick its English meaning</li>
                <li class="step">Submit and check your score</li>
            </ol>
        <p class="meta">4 words · about 1 minute</p>
        <a class="submit-btn" href="step1.html">Start</a>
        </section>
    </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
